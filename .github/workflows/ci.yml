name: CI

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (g++, no PROS/hardware)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host test suite
        run: |
          chmod +x tests/run_tests.sh
          CXX=g++ STD=gnu++20 tests/run_tests.sh

  pros-build:
    name: Build PROS template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LemLib/pros-build
        id: build
        uses: LemLib/pros-build@v5.1.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ github.workspace }}/template/*
