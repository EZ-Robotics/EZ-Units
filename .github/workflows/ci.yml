name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.cxx }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: g++
            std: gnu++20
          - cxx: g++
            std: gnu++23
          - cxx: clang++
            std: c++20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run host test suite
        run: |
          chmod +x tests/run_tests.sh
          CXX=${{ matrix.cxx }} STD=${{ matrix.std }} tests/run_tests.sh

  literal-spelling:
    name: Literal operator spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject spaced literal operators
        run: "! grep -rn 'operator\"\" ' include/"

      - name: Compile header with -Werror=deprecated-literal-operator
        run: |
          echo '#include <EZ-Units/units.hpp>' > tu.cpp
          clang++ -std=c++2c -Iinclude -Werror=deprecated-literal-operator -fsyntax-only tu.cpp

  pros-build:
    name: Build PROS template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run LemLib/pros-build
        id: build
        uses: LemLib/pros-build@v5.1.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ github.workspace }}/template/*
